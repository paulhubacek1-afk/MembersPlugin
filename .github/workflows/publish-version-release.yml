name: Publish versioned release

on:
  push:
    branches:
      - main
    paths:
      - members-plugin.php
      - .github/workflows/publish-version-release.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish release and plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '/Version:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' members-plugin.php)"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "::error::Invalid plugin version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release if this version is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; the ZIP will be rebuilt from this commit."
          else
            gh release create "$TAG" --title "Members Plugin $TAG" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi

      - name: Build and validate distributable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/members-plugin build/members-plugin.zip
          mkdir -p build/members-plugin
          git archive HEAD | tar -x -C build/members-plugin
          cd build/members-plugin
          rm -rf .github tools composer.json package.json .distignore .gitignore .gitattributes
# Include the official German catalog for the bundled legacy text domain.
TRANSLATION_API="$(curl --fail --silent --show-error --location --retry 3 'https://api.wordpress.org/translations/plugins/1.0/?slug=ultimate-member&version=2.14.1')"
TRANSLATION_URL="$(printf '%s' "$TRANSLATION_API" | jq -r '.translations[]? | select(.language == "de_DE") | .package' | head -n 1)"
if [[ -z "$TRANSLATION_URL" || "$TRANSLATION_URL" == "null" ]]; then
  echo "::error::WordPress.org returned no de_DE translation package for the bundled ultimate-member core."
  exit 1
fi
curl --fail --silent --show-error --location --retry 3 "$TRANSLATION_URL" -o /tmp/ultimate-member-de_DE.zip
MO_ENTRY="$(unzip -Z1 /tmp/ultimate-member-de_DE.zip | grep -E '(^|/)ultimate-member-de_DE\.mo          HEADER_VERSION="$(awk -F': ' '/Version:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' members-plugin.php)"
          test "$HEADER_VERSION" = "${{ steps.version.outputs.version }}"
          cd ../..
          mkdir -p build
          (cd build && zip -qr members-plugin.zip members-plugin)
          unzip -t build/members-plugin.zip
          unzip -p build/members-plugin.zip members-plugin/members-plugin.php | grep -Fq "* Version: ${{ steps.version.outputs.version }}"
          test -s build/members-plugin.zip
          ls -lh build/members-plugin.zip

      - name: Replace release ZIP with verified build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" build/members-plugin.zip --clobber
          gh release view "$TAG" --json isDraft,assets --jq '. as $r | if $r.isDraft == false and any($r.assets[]; .name == "members-plugin.zip" and .size > 0) then "Release asset verified" else error("Published release ZIP is missing or invalid") end'
 | head -n 1 || true)"
if [[ -z "$MO_ENTRY" ]]; then
  echo "::error::The German translation archive did not contain ultimate-member-de_DE.mo."
  exit 1
fi
mkdir -p languages
unzip -p /tmp/ultimate-member-de_DE.zip "$MO_ENTRY" > languages/ultimate-member-de_DE.mo
test -s languages/ultimate-member-de_DE.mo
echo "Included German translation: languages/ultimate-member-de_DE.mo"
