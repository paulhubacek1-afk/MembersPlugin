name: Publish versioned release

on:
  push:
    branches:
      - main
    paths:
      - members-plugin.php

permissions:
  contents: write

jobs:
  publish:
    name: Publish release and plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '/Version:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' members-plugin.php)"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::Invalid plugin version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release if this version is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "Members Plugin $TAG" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi

      - name: Check whether release ZIP already exists
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'members-plugin.zip'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing ZIP found; leaving the published asset unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributable plugin ZIP
        if: steps.asset.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/members-plugin
          mkdir -p build/members-plugin
          git archive HEAD | tar -x -C build/members-plugin
          cd build/members-plugin
          rm -rf .github tools composer.json package.json .distignore .gitignore .gitattributes
          cd ../..
          cd build
          zip -qr members-plugin.zip members-plugin
          cd ..
          ls -lh build/members-plugin.zip

      - name: Attach ZIP to GitHub Release
        if: steps.asset.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" build/members-plugin.zip
