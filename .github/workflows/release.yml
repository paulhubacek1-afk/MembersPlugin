# Baut members-plugin.zip und hängt sie an das GitHub-Release.
# Auslöser: ein Tag "v1.2.3" wird gepusht ODER ein Release wird auf GitHub veröffentlicht.
# Der WordPress-Updater des Plugins lädt genau dieses Asset.
name: Release-ZIP bauen

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Version prüfen (Plugin-Header == Tag)
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' members-plugin.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          echo "Tag: $TAG  Header: $HEADER"
          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::Die Version im Plugin-Header ($HEADER) passt nicht zum Tag ($TAG). Bitte 'Version:' in members-plugin.php anpassen."
            exit 1
          fi
          php -l members-plugin.php

      - name: ZIP bauen
        run: |
          mkdir -p build/members-plugin
          git archive HEAD | tar -x -C build/members-plugin
          cd build/members-plugin
          rm -rf .github tools composer.json package.json .distignore .gitignore .gitattributes
# Include the official German catalog for the bundled legacy text domain.
TRANSLATION_API="$(curl --fail --silent --show-error --location --retry 3 'https://api.wordpress.org/translations/plugins/1.0/?slug=ultimate-member&version=2.14.1')"
TRANSLATION_URL="$(printf '%s' "$TRANSLATION_API" | jq -r '.translations[]? | select(.language == "de_DE") | .package' | head -n 1)"
if [[ -z "$TRANSLATION_URL" || "$TRANSLATION_URL" == "null" ]]; then
  echo "::error::WordPress.org returned no de_DE translation package for the bundled ultimate-member core."
  exit 1
fi
curl --fail --silent --show-error --location --retry 3 "$TRANSLATION_URL" -o /tmp/ultimate-member-de_DE.zip
MO_ENTRY="$(unzip -Z1 /tmp/ultimate-member-de_DE.zip | grep -E '(^|/)ultimate-member-de_DE\.mo          cd ..
          zip -qr members-plugin.zip members-plugin
          ls -la members-plugin.zip

      - name: Release anlegen bzw. ZIP anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" build/members-plugin.zip --clobber
 | head -n 1 || true)"
if [[ -z "$MO_ENTRY" ]]; then
  echo "::error::The German translation archive did not contain ultimate-member-de_DE.mo."
  exit 1
fi
mkdir -p languages
unzip -p /tmp/ultimate-member-de_DE.zip "$MO_ENTRY" > languages/ultimate-member-de_DE.mo
test -s languages/ultimate-member-de_DE.mo
echo "Included German translation: languages/ultimate-member-de_DE.mo"
          cd ..
          zip -qr members-plugin.zip members-plugin
          ls -la members-plugin.zip

      - name: Release anlegen bzw. ZIP anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" build/members-plugin.zip --clobber
